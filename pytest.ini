[pytest]
DJANGO_SETTINGS_MODULE = umg_config.settings_test
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -m "not smoke": los smoke tests golpean la API desplegada en Render y no deben
# correr en cada ejecucion local. Se invocan aparte con:  pytest -m smoke
addopts =
    -v
    --strict-markers
    --tb=short
    -m "not smoke"

markers =
    unit: prueba unitaria (regla de negocio aislada, sin recorrer la capa HTTP)
    integration: prueba de integracion (URL -> vista -> ORM -> respuesta HTTP)
    smoke: prueba de solo lectura contra el ambiente desplegado en Render
    hu001: HU-001 Registrar una nueva reserva
    hu002: HU-002 Validacion automatica de disponibilidad
    hu003: HU-003 Consultar disponibilidad de laboratorios
    hu004: HU-004 Visualizar el listado global de reservas
    hu005: HU-005 Consultar una reserva por su identificador
    hu006: HU-006 Filtrar reservas por criterios
    hu007: HU-007 Modificar una reserva existente
    hu008: HU-008 Cancelar una reserva activa
    hu009: HU-009 Consultar el historial de auditoria
    hu010: HU-010 Gestion automatica de estados
